<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CyberShift — Ultimate Dual-Perspective Cyber Warfare Simulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: {
  colors: {
    cyberdark: '#0a0f1d', cybercard: '#121c2e', cyberborder: '#1e293b',
    cyberblue: '#38bdf8', cyberpurple: '#a855f7',
    cyberred: '#f43f5e', cybergreen: '#10b981', cyberamber: '#f59e0b',
  },
  fontFamily: {
    mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
    sans: ['Inter', 'system-ui', 'sans-serif'],
  },
}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
html, body {
  height: 100%; height: 100dvh; overflow: hidden;
  overscroll-behavior: none;
  background: #0a0f1d; color: #f8fafc;
  font-family: 'Inter', system-ui, sans-serif;
}
body { user-select: none; -webkit-user-select: none; }
input, textarea, select { font-size: 16px !important; }
button { touch-action: manipulation; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.scanline {
  background-image: linear-gradient(rgba(255,255,255,0), rgba(0,0,0,.12) 50%, rgba(0,0,0,.12) 50%);
  background-size: 100% 4px;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
.app-shell { display: grid; grid-template-rows: auto auto 1fr auto; height: 100dvh; }
.safe-top    { padding-top:    max(0px, env(safe-area-inset-top)); }
.safe-bottom { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
.page-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.app-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; min-height: 52px;
  background: rgba(10,15,29,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid #1e293b;
}
.app-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: #1e293b; border-bottom: 1px solid #1e293b;
}
.app-stats > div { background: #0a0f1d; padding: 8px 12px; text-align: center; }
.app-bottomnav {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: rgba(18,28,46,.96); backdrop-filter: blur(14px);
  border-top: 1px solid #1e293b;
}
.app-bottomnav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 8px 4px; min-height: 56px;
  color: #64748b; font-size: 9px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .05em;
  transition: color 120ms;
}
.app-bottomnav button.active { color: #38bdf8; }
.tap-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; border-radius: 12px;
  background: #121c2e; border: 1px solid #1e293b;
  min-height: 64px; width: 100%; text-align: left;
  transition: transform 120ms, border-color 120ms, background 120ms;
  color: inherit;
}
.tap-card:active { transform: scale(.985); border-color: #38bdf8; background: #1a2740; }
</style>
</head>
<body class="scanline">
<div id="app"></div>
<script>
(function () {
'use strict';

const LAB_PASSCODE = "CYBER2026";
const NEOBANKS = ["Chime", "Mercury", "Revolut", "Brex", "Qonto", "Wise", "Monzo", "Aline"];

const STAGES = [
  { id: 1, title: '1. Network Pipeline & Anonymity Stack', icon: 'network', options: { type: ['Public Wi-Fi Snipe', 'Encrypted Private Mesh', 'Tor Exit Node Relay'], stack: ['Multi-Hop VPN + Proxychain', 'Shadowsocks + WireGuard', 'P2P Intranet Bridge'], dns: ['Cloudflare (1.1.1.1)', 'Quad9 Encrypted', 'Self-Hosted Unbound DNS'] } },
  { id: 2, title: '2. Operating System & Hardening', icon: 'cpu', options: { os: ['Tails OS (Amnesic Live)', 'Qubes OS (Isolated VMs)', 'Kali Linux / Custom CyberG', 'Debian VPS Node'] } },
  { id: 3, title: '3. Identity & Contact Network', icon: 'user-check', options: { comm: ['Signal / Session Mesh', 'Telegram Encrypted Ops', 'Matrix / Element Node'], alias: ['CyberGhost_0x', 'Spectre Ops', 'VaporNet Core'], teamSize: ['3 Operators', '5 Operators (Full Cell)', '7 Global Nodes'] } },
  { id: 4, title: '4. Entity Formation (LLC Setup)', icon: 'briefcase', options: { jurisdiction: ['Delaware, USA', 'Wyoming Anonymous LLC', 'Nevis Offshore LLC'], ownership: ['Persona Identity', 'Nominee Manager', 'Burner Shell Entity'] } },
  { id: 5, title: '5. Crypto Wallet & Mixer Routing', icon: 'lock', options: { mixer: ['Tornado Cash Relay', 'CoinJoin P2P Pool', 'Monero Atomic Swap'], hardware: ['Coldcard Offline Vault', 'Trezor Hardware Safe', 'Air-Gapped Multi-Sig'] } },
  { id: 6, title: '6. Offshore Shell & Financial Logistics', icon: 'dollar-sign', options: { location: ['Panama City Bank', 'Zurich Nominee Account', 'Cayman Islands Shell'], transit: ['Wire Tunneling', 'Crypto Liquidity Pool', 'Physical Courier Drops'] } },
  { id: 7, title: '7. Forgery Studio & Document Forge', icon: 'layers', options: { template: ['Passport & Driver License', 'Birth Certificate & SSN', 'Corporate Deed & Mortgage', 'Cashier Check & Payroll'] } },
  { id: 8, title: '8. Crypto Treasury Asset Encryption', icon: 'shield', options: { asset: ['BTC Reserve', 'XMR Stealth Cache', 'ETH Smart Vault'], security: ['Shamir Secret Sharing', 'Hardware Ledger Matrix', 'Dead Man Trigger'] } },
  { id: 9, title: '9. Financial Leverage & Bookie Operations', icon: 'dices', options: { market: ['Offshore Sports Betting Bookie', 'High-Frequency Crypto Futures', 'Dark Pool Stock Arbitrage'] } },
  { id: 10, title: '10. Command Center & Visual Map', icon: 'image', options: { dashboard: ['Real-Time Visual Telemetry Board', 'Interactive Node Graph', 'Heads-Up Threat Matrix'] } },
  { id: 11, title: '11. Field Espionage & Target Ops', icon: 'eye', options: { target: ['Rival Tech Syndicate', 'Offshore Banking Director', 'Defense Contractor Node'], vector: ['Physical Infiltration & Credentials', 'Social Engineering Espionage', 'Blackmail / Credential Extraction'] } }
];

const KEY = 'cybershift:master_v3';
let state = {
  v: 3, authenticated: false, role: null, phase: 'auth',
  difficulty: 'MEDIUM', currentStageIndex: 0,
  capital: 25000, heat: 5, caseStrength: 25,
  breakoutState: {}, logs: ['[SYS] Master CyberShift Engine Ready.'],
  selectedForgeDoc: 'Passport & Driver License', forgeOutput: null,
  decryptedCount: 0,
  decryptionLogs: [
    { id: 'LOG-8801', raw: 'ENC_7a8f9b::PROXY_NODE_192.168.1.45::TLS_SIG_MATCH', decrypted: false, val: 'TLS Client Hello fingerprint collision detected on residential proxy subnet.' },
    { id: 'LOG-8802', raw: 'ENC_3c2d1e::VELOCITY_API_EXCEEDED::NEO_CLUSTER', decrypted: false, val: 'Cross-platform API velocity anomaly flagged by real-time consortium nodes.' },
    { id: 'LOG-8803', raw: 'ENC_9f8e7d::GRAPH_CIRCULAR_ACH::DEPOSIT_SWAP', decrypted: false, val: 'Circular ACH transaction graph asymmetry identified across neobank cluster.' }
  ]
};

try {
  const raw = localStorage.getItem(KEY);
  if (raw) Object.assign(state, JSON.parse(raw));
} catch {}

function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function notify() { persist(); render(); }
function haptic(p = 10) { try { navigator.vibrate?.(p); } catch {} }
function icons() { if (window.lucide) window.lucide.createIcons(); }

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-20 z-50 bg-cybercard border border-cyberborder px-4 py-2 rounded-lg text-xs font-mono text-white shadow-xl';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

const clamp = (v, lo = 0, hi = 100) => Math.min(hi, Math.max(lo, v));

const routes = {};
const register = (path, page) => { routes[path] = page; };
const currentPath = () => (location.hash.slice(1) || '/ops').split('?')[0];

function navigate(path) {
  location.hash = '#' + path;
  render();
}

async function render() {
  const app = document.getElementById('app');

  if (!state.authenticated || !state.role) { 
    renderAuthAndRole(app); 
    return; 
  }
  if (state.phase === 'briefing') { 
    renderBriefing(app); 
    return; 
  }

  app.innerHTML = `
    <div id="shell" class="app-shell">
      <header id="topbar" class="app-topbar safe-top"></header>
      <div id="stats" class="app-stats"></div>
      <main id="outlet" class="page-scroll"></main>
      <nav id="bottomnav" class="app-bottomnav safe-bottom"></nav>
    </div>`;

  renderShell();

  const path = currentPath();
  const page = routes[path] || routes['/ops'];
  const outlet = document.getElementById('outlet');
  if (outlet && page && page.mount) {
    await page.mount(outlet);
  }

  icons();
}

function renderTopbar() {
  const isAtk = state.role === 'attacker';
  const el = document.getElementById('topbar');
  if (!el) return;
  el.innerHTML = `
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg ${isAtk ? 'bg-cyberred/20 text-cyberred' : 'bg-cybergreen/20 text-cybergreen'} flex items-center justify-center">
        <i data-lucide="${isAtk ? 'terminal' : 'shield-check'}" class="w-4 h-4"></i>
      </div>
      <div>
        <div class="font-mono font-bold text-xs text-white">CYBERSHIFT</div>
        <div class="font-mono text-[9px] ${isAtk ? 'text-cyberred' : 'text-cybergreen'}">${isAtk ? 'ROB U. (ATTACKER)' : 'CRAIG B. (DEFENDER)'}</div>
      </div>
    </div>
    <div class="text-right">
      <div class="font-mono text-[9px] text-slate-500">${isAtk ? 'HEAT' : 'CASE STRENGTH'}</div>
      <div class="font-mono font-bold text-sm ${isAtk ? 'text-cyberred' : 'text-cybergreen'}">${isAtk ? state.heat + '%' : state.caseStrength + '%'}</div>
    </div>`;
}

function renderStats() {
  const el = document.getElementById('stats');
  if (!el) return;
  el.innerHTML = `
    <div><div class="text-[9px] font-mono text-slate-500">CAPITAL</div><div class="font-mono font-bold text-xs text-cybergreen">$${state.capital.toLocaleString()}</div></div>
    <div><div class="text-[9px] font-mono text-slate-500">STAGE</div><div class="font-mono font-bold text-xs text-cyberblue">${state.currentStageIndex + 1}/11</div></div>
    <div><div class="text-[9px] font-mono text-slate-500">DIFFICULTY</div><div class="font-mono font-bold text-xs text-amber-400">${state.difficulty}</div></div>`;
}

const NAV_TABS = [
  { path: '/ops',        icon: 'terminal',     label: 'MISSIONS' },
  { path: '/forge',      icon: 'layers',       label: 'FORGE' },
  { path: '/video',      icon: 'video',        label: 'TRAINING' },
  { path: '/game',       icon: 'activity',     label: 'LOGS' },
  { path: '/export',     icon: 'download',     label: 'EXPORT' }
];

function renderNav() {
  const here = currentPath();
  const el = document.getElementById('bottomnav');
  if (!el) return;
  el.innerHTML = NAV_TABS.map(t => `
    <button data-path="${t.path}" class="${here === t.path ? 'active' : ''}">
      <i data-lucide="${t.icon}" class="w-4 h-4"></i>
      <span>${t.label}</span>
    </button>`).join('');
  el.querySelectorAll('button').forEach(btn =>
    btn.addEventListener('click', () => { haptic(8); navigate(btn.dataset.path); }));
}

function renderShell() { renderTopbar(); renderStats(); renderNav(); }

function renderAuthAndRole(app) {
  app.innerHTML = `
    <div class="fixed inset-0 z-50 bg-cyberdark flex items-center justify-center p-4 overflow-y-auto">
      <div class="max-w-md w-full bg-cybercard border border-cyberborder rounded-2xl p-6 space-y-4 text-center my-auto">
        <div class="w-16 h-16 rounded-2xl bg-cyberblue/10 border border-cyberblue/30 mx-auto flex items-center justify-center">
          <i data-lucide="shield-alert" class="w-8 h-8 text-cyberblue"></i>
        </div>
        <h1 class="font-mono text-lg font-bold text-white">CYBERSHIFT ACADEMIC LAB</h1>
        <p class="text-xs text-slate-400">Dual-Perspective Threat Mindset & Incident Defense Training</p>
        
        <input type="password" id="passcode" placeholder="Lab Passcode (CYBER2026)" class="w-full bg-cyberdark border border-cyberborder rounded-lg p-2 text-center text-sm font-mono text-white">
        
        <div class="space-y-2 pt-2">
          <button id="btn-attacker" class="tap-card border-cyberred/40">
            <i data-lucide="terminal" class="w-5 h-5 text-cyberred"></i>
            <div>
              <div class="font-mono text-xs font-bold text-cyberred">Play Rob U. (Attacker Mindset)</div>
              <div class="text-[10px] text-slate-400">Master identity assembly, neobank application stacking & bust-out mechanics.</div>
            </div>
          </button>
          <button id="btn-defender" class="tap-card border-cybergreen/40">
            <i data-lucide="shield-check" class="w-5 h-5 text-cybergreen"></i>
            <div>
              <div class="font-mono text-xs font-bold text-cybergreen">Play Craig Bluebird (Cyber Officer)</div>
              <div class="text-[10px] text-slate-400">Hunt consortium velocity anomalies, parse logs & export e-SAR reports.</div>
            </div>
          </button>
        </div>
      </div>
    </div>`;
  icons();

  document.getElementById('btn-attacker')?.addEventListener('click', () => window.initRole('attacker'));
  document.getElementById('btn-defender')?.addEventListener('click', () => window.initRole('defender'));
}

function renderBriefing(app) {
  const isAtk = state.role === 'attacker';
  app.innerHTML = `
    <div class="fixed inset-0 z-50 bg-cyberdark flex items-center justify-center p-4 overflow-y-auto">
      <div class="max-w-md w-full bg-cybercard border border-cyberborder rounded-2xl p-6 space-y-4 my-auto">
        <div class="font-mono text-xs text-cyberblue uppercase">${isAtk ? 'Attacker Dossier · Rob U.' : 'Officer Dossier · Craig Bluebird'}</div>
        <div class="text-xs text-slate-300 leading-relaxed font-sans space-y-2 bg-cyberdark p-4 rounded-xl border border-cyberborder">
          ${isAtk ? `
            <p><strong>Background:</strong> Abandoned at age 6, raised in an institution with a single donated computer terminal. Physically disabled in his legs from early malnutrition, code became his equalizer against childhood bullies and systemic abandonment.</p>
            <p><strong>Objective:</strong> Execute the 11-stage breakout missions across ${NEOBANKS.join(', ')} before risk engines catch your velocity.</p>
          ` : `
            <p><strong>Background:</strong> Ghetto survivor turned military veteran and senior financial cybersecurity officer.</p>
            <p><strong>Objective:</strong> Parse intercepted telemetry logs, trace TLS fingerprint collisions, and compile certified e-SAR referral packages.</p>
          `}
        </div>

        <button id="btn-start" class="w-full py-3 bg-cyberblue text-black font-mono font-bold text-xs rounded-xl">ENTER SIMULATION →</button>
      </div>
    </div>`;
  icons();

  document.getElementById('btn-start')?.addEventListener('click', () => window.startSim());
}

const opsPage = {
  async mount(root) {
    const stage = STAGES[state.currentStageIndex] || STAGES[10];
    const isAtk = state.role === 'attacker';

    root.innerHTML = `
      <div class="p-4 space-y-4">
        <div class="flex items-center justify-between bg-cybercard border border-cyberborder p-2 rounded-xl text-xs">
          <span class="text-slate-400 font-mono">DIFFICULTY:</span>
          <div class="flex gap-2 font-mono font-bold">
            ${['EASY', 'MEDIUM', 'HACKER'].map(d => `
              <button data-diff="${d}" class="px-2 py-1 rounded ${state.difficulty === d ? 'bg-cyberblue text-black' : 'text-slate-500 bg-cyberdark'}">${d}</button>
            `).join('')}
          </div>
        </div>

        <div class="bg-cybercard border ${isAtk ? 'border-cyberred/40' : 'border-cybergreen/40'} rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center border-b border-cyberborder pb-2">
            <div class="flex items-center gap-2">
              <i data-lucide="${stage.icon}" class="w-5 h-5 ${isAtk ? 'text-cyberred' : 'text-cybergreen'}"></i>
              <span class="font-mono text-sm font-bold text-white">${stage.title}</span>
            </div>
            <span class="text-xs font-mono text-cyberamber">MISSION ${stage.id}/11</span>
          </div>

          <div class="space-y-3 pt-2">
            ${Object.entries(stage.options).map(([key, opts]) => `
              <div>
                <div class="text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">${key}:</div>
                <div class="flex flex-wrap gap-1">
                  ${opts.map(opt => `<button class="opt-btn text-[11px] bg-cyberdark hover:bg-slate-800 text-slate-200 px-2 py-1 rounded border border-cyberborder font-mono">${opt}</button>`).join('')}
                </div>
              </div>
            `).join('')}

            <button id="execute-btn" class="w-full mt-3 ${isAtk ? 'bg-cyberred text-white' : 'bg-cybergreen text-black'} text-xs font-mono font-bold py-3 rounded-lg flex items-center justify-center gap-2">
              Execute Mission Stage <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="bg-cyberdark border border-cyberborder rounded-xl p-3 h-44 flex flex-col justify-between font-mono text-xs">
          <div class="text-[10px] text-slate-500 border-b border-cyberborder pb-1">TTY TERMINAL LOGS</div>
          <div class="overflow-y-auto space-y-1 my-2 text-slate-300">
            ${state.logs.map(l => `<div>${l}</div>`).join('')}
          </div>
          <form id="term-form" class="flex gap-2 border-t border-cyberborder pt-1">
            <span class="${isAtk ? 'text-cyberred' : 'text-cybergreen'} font-bold">&gt;</span>
            <input id="term-input" type="text" placeholder="Type 'status', 'advance', 'help', or 'clear'..." class="bg-transparent text-xs text-white focus:outline-none flex-1">
          </form>
        </div>
      </div>
    `;

    root.querySelectorAll('button[data-diff]').forEach(b => {
      b.addEventListener('click', () => {
        state.difficulty = b.dataset.diff;
        if (state.difficulty === 'EASY') state.capital = 100000;
        if (state.difficulty === 'MEDIUM') state.capital = 25000;
        if (state.difficulty === 'HACKER') state.capital = 2500;
        notify();
      });
    });

    root.querySelector('#execute-btn')?.addEventListener('click', () => executeStage());
    root.querySelector('#term-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = root.querySelector('#term-input');
      const cmd = input.value.trim().toLowerCase();
      if (!cmd) return;
      input.value = '';

      state.logs.push(`> ${cmd}`);
      if (cmd === 'help') state.logs.push('[SYS] Commands: advance, status, clear, help');
      else if (cmd === 'status') state.logs.push(`[STATUS] Heat: ${state.heat}% | Case: ${state.caseStrength}% | Credits: $${state.capital}`);
      else if (cmd === 'clear') state.logs = [];
      else if (cmd === 'advance') { executeStage(); return; }
      else state.logs.push(`[ERR] Unknown: ${cmd}`);
      notify();
    });

    function executeStage() {
      const heatMod = state.difficulty === 'EASY' ? 0.5 : state.difficulty === 'MEDIUM' ? 1.0 : 2.0;
      const inc = Math.floor((Math.random() * 8 + 4) * heatMod);
      const cost = Math.floor(Math.random() * 800 + 200);

      if (state.role === 'attacker') {
        state.heat = clamp(state.heat + inc);
        state.capital = Math.max(0, state.capital - cost);
        state.logs.push(`[${new Date().toLocaleTimeString()}] Stage ${stage.id} executed. Cost: $${cost}, Heat: +${inc}%`);
      } else {
        state.caseStrength = clamp(state.caseStrength + 10);
        state.logs.push(`[${new Date().toLocaleTimeString()}] Defense Stage ${stage.id} verified. Case Strength: +10%`);
      }
      state.breakoutState[stage.id] = true;
      if (state.currentStageIndex < STAGES.length - 1) state.currentStageIndex += 1;
      else state.logs.push('[OPS COMPLETE] All 11 Breakout Missions Executed.');
      notify();
    }
    icons();
  }
};

const forgePage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-4">
        <div class="bg-cybercard border border-cyberborder rounded-xl p-4 space-y-3">
          <h2 class="font-mono text-xs uppercase tracking-wider text-cyberpurple flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4"></i> Synthetic Visual Rendering Engine
          </h2>
          <div class="space-y-1">
            ${['Passport & Driver License', 'Birth Certificate & SSN', 'Corporate Deed & Mortgage', 'Cashier Check & Payroll'].map(doc => `
              <button data-doc="${doc}" class="w-full text-left p-2 rounded text-xs font-mono border ${state.selectedForgeDoc === doc ? 'bg-cyberpurple/20 border-cyberpurple text-white' : 'bg-cyberdark border-cyberborder text-slate-400'}">${doc}</button>
            `).join('')}
          </div>
          <button id="render-forge" class="w-full py-3 bg-cyberpurple text-white text-xs font-mono font-bold rounded-lg">Render Canvas Document Payload</button>
        </div>
        <div class="bg-cyberdark border border-cyberborder rounded-xl p-4 flex flex-col items-center justify-center min-h-[240px]">
          <canvas id="forge-canvas" width="280" height="160" class="border border-cyberpurple/40 rounded-lg shadow-lg bg-slate-900 mb-3"></canvas>
          <div class="w-full font-mono text-xs text-slate-400 space-y-1">
            ${state.forgeOutput ? `<div class="text-cyberpurple font-bold">${state.forgeOutput.type}</div><div>ID: ${state.forgeOutput.id}</div><div class="text-cybergreen">HASH: ${state.forgeOutput.hash}</div>` : '<div class="text-center text-slate-500">Select template and render.</div>'}
          </div>
        </div>
      </div>`;

    root.querySelectorAll('button[data-doc]').forEach(b => {
      b.addEventListener('click', () => { state.selectedForgeDoc = b.dataset.doc; forgePage.mount(root); });
    });

    const canvas = root.querySelector('#forge-canvas');
    if (canvas && state.forgeOutput) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 10px "JetBrains Mono"'; ctx.fillText('SYNTHETIC PAYLOAD', 15, 25);
      ctx.fillStyle = '#cbd5e1'; ctx.font = '9px "JetBrains Mono"';
      ctx.fillText(`TYPE: ${state.forgeOutput.type}`, 15, 50);
      ctx.fillText(`ID: ${state.forgeOutput.id}`, 15, 70);
      ctx.fillText(`HASH: ${state.forgeOutput.hash}`, 15, 90);
    }

    root.querySelector('#render-forge')?.addEventListener('click', () => {
      state.forgeOutput = { type: state.selectedForgeDoc, id: `FRG-${Math.floor(100000 + Math.random() * 900000)}`, hash: Math.random().toString(36).substring(2, 12).toUpperCase() };
      haptic(15); forgePage.mount(root);
    });
    icons();
  }
};

const videoTrainingPage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-4 font-mono text-xs">
        <h2 class="uppercase text-slate-400">Cybersecurity Training Academy & Video Walkthroughs</h2>
        <div class="text-slate-300 text-[11px]">Watch professional walkthroughs on incident response, threat hunting, and SOC analysis.</div>
        
        <div class="bg-cybercard border border-cyberborder rounded-xl p-3 space-y-2">
          <div class="text-white font-bold">Module 1: Incident Response & SOC Operations</div>
          <div class="w-full bg-slate-900 border border-cyberborder rounded-lg overflow-hidden p-2 text-center">
            <iframe class="w-full h-48 rounded" src="https://www.youtube-nocookie.com/embed/videoseries?list=PLDzeHZWIZsTo0wSBdqtT4z739ZzR5qj8j" title="Incident Response" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      </div>`;
    icons();
  }
};

const gamePage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-3 font-mono text-xs">
        <h2 class="uppercase text-slate-400">Intercepted Telemetry Decryption Challenge</h2>
        <div class="text-slate-300 text-[11px]">Parse encrypted network signatures into verifiable incident evidence.</div>
        <div class="space-y-2">
          ${state.decryptionLogs.map(l => `
            <div class="p-3 bg-cybercard border ${l.decrypted ? 'border-cybergreen' : 'border-cyberborder'} rounded-xl space-y-1">
              <div class="flex justify-between font-bold">
                <span class="text-white">${l.id}</span>
                <span class="${l.decrypted ? 'text-cybergreen' : 'text-cyberamber'}">${l.decrypted ? 'DECRYPTED' : 'ENCRYPTED'}</span>
              </div>
              <div class="text-[10px] text-slate-400 font-mono">${l.decrypted ? l.val : l.raw}</div>
              ${!l.decrypted ? `<button onclick="window.decryptLog('${l.id}')" class="mt-2 px-3 py-1 bg-cyberblue/20 text-cyberblue border border-cyberblue/40 rounded text-[10px] font-bold">PARSE PAYLOAD</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>`;
    icons();
  }
};

const exportPage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-3 font-mono text-xs">
        <h2 class="uppercase text-slate-400">e-SAR Package & Evidence Export</h2>
        <div class="p-4 bg-cybercard border border-cyberborder rounded-xl space-y-3">
          <div class="text-white font-bold">Certified Case Summary</div>
          <div class="text-slate-300 text-[11px]">Export immutable forensic logs, decrypted TLS signatures, and telemetry metadata into a downloadable JSON evidence package.</div>
          <button onclick="window.exportReport()" class="w-full py-3 bg-cybergreen text-black font-bold rounded-lg flex items-center justify-center gap-2">
            <i data-lucide="file-json" class="w-4 h-4"></i> EXPORT e-SAR EVIDENCE PACKAGE (JSON)
          </button>
        </div>
      </div>`;
    icons();
  }
};

window.initRole = (role) => {
  const code = document.getElementById('passcode')?.value.trim();
  if (code !== LAB_PASSCODE) { toast('Invalid Lab Passcode'); return; }
  state.role = role; 
  state.authenticated = true;
  state.phase = 'briefing';
  notify();
};

window.startSim = () => { 
  state.phase = 'active'; 
  notify(); 
  navigate('/ops'); 
};

window.decryptLog = (id) => {
  const item = state.decryptionLogs.find(l => l.id === id);
  if (item && !item.decrypted) {
    item.decrypted = true;
    state.decryptedCount += 1;
    state.caseStrength = clamp(state.caseStrength + 25);
    notify();
    toast('Log Payload Parsed');
  }
};

window.exportReport = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `eSAR_Case_Report_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
  toast('e-SAR Package Exported');
};

register('/ops', opsPage);
register('/forge', forgePage);
register('/video', videoTrainingPage);
register('/game', gamePage);
register('/export', exportPage);

window.addEventListener('hashchange', render);
render();

})();
</script>
</body>
</html>
