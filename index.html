<!DOCTYPE html>

<head>

tailwind.config = { darkMode: 'class', theme: { extend: {

<style>
*, *::before, *::after { -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
html, body {
  height: 100%; height: 100dvh; overflow: hidden;
  overscroll-behavior: none;
  background: #0a0f1d; color: #f8fafc;
  font-family: 'Inter', system-ui, sans-serif;
}
body { user-select: none; -webkit-user-select: none; }
input, textarea, select { font-size: 16px !important; }
button { touch-action: manipulation; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.scanline {
  background-image: linear-gradient(rgba(255,255,255,0), rgba(0,0,0,.12) 50%, rgba(0,0,0,.12) 50%);
  background-size: 100% 4px;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
.app-shell { display: grid; grid-template-rows: auto auto 1fr auto; height: 100dvh; }
.safe-top    { padding-top:    max(0px, env(safe-area-inset-top)); }
.safe-bottom { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
.page-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.app-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; min-height: 52px;
  background: rgba(10,15,29,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid #1e293b;
}
.app-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: #1e293b; border-bottom: 1px solid #1e293b;
}
.app-stats > div { background: #0a0f1d; padding: 8px 12px; text-align: center; }
.app-bottomnav {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: rgba(18,28,46,.96); backdrop-filter: blur(14px);
  border-top: 1px solid #1e293b;
}
.app-bottomnav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 8px 4px; min-height: 56px;
  color: #64748b; font-size: 10px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .05em;
  transition: color 120ms;
}
.app-bottomnav button.active { color: #38bdf8; }
.app-bottomnav button:active { background: rgba(56,189,248,.08); }
.tap-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; border-radius: 12px;
  background: #121c2e; border: 1px solid #1e293b;
  min-height: 64px; width: 100%; text-align: left;
  transition: transform 120ms, border-color 120ms, background 120ms;
  color: inherit;
}
.tap-card:active { transform: scale(.985); border-color: #38bdf8; background: #1a2740; }
.sheet-backdrop { animation: fade-in 160ms ease-out; }
.sheet { animation: slide-up 220ms cubic-bezier(.22,1,.36,1); }
.toast-anim { animation: slide-up 180ms ease-out; }
.screen-shake { animation: shake 380ms cubic-bezier(.36,.07,.19,.97); }
.red-flash::after {
  content: ''; position: fixed; inset: 0; z-index: 60;
  background: #f43f5e; pointer-events: none;
  animation: flash 500ms ease-out forwards;
}
@keyframes fade-in  { from { opacity: 0 } to { opacity: 1 } }
@keyframes slide-up { from { transform: translateY(100%) } to { transform: translateY(0) } }
@keyframes shake {
  10%, 90% { transform: translate3d(-2px,0,0) }
  20%, 80% { transform: translate3d(4px,0,0) }
  30%, 50%, 70% { transform: translate3d(-6px,0,0) }
  40%, 60% { transform: translate3d(6px,0,0) }
}
@keyframes flash { to { opacity: 0 } }
</style>
</head>
<body class="scanline">
<div id="app"></div>
<script>
(function () {
'use strict';

// ============================================================
// STAGES & MISSIONS DEFINITION
// ============================================================
const STAGES = [
  { id: 1, title: '1. Network Pipeline & Anonymity Stack', icon: 'network', options: { type: ['Public Wi-Fi Snipe', 'Encrypted Private Mesh', 'Tor Exit Node Relay'], stack: ['Multi-Hop VPN + Proxychain', 'Shadowsocks + WireGuard', 'P2P Intranet Bridge'], dns: ['Cloudflare (1.1.1.1)', 'Quad9 Encrypted', 'Self-Hosted Unbound DNS'] } },
  { id: 2, title: '2. Operating System & Hardening', icon: 'cpu', options: { os: ['Tails OS (Amnesic Live)', 'Qubes OS (Isolated VMs)', 'Kali Linux / Custom CyberG', 'Debian VPS Node'] } },
  { id: 3, title: '3. Identity & Contact Network', icon: 'user-check', options: { comm: ['Signal / Session Mesh', 'Telegram Encrypted Ops', 'Matrix / Element Node'], alias: ['CyberGhost_0x', 'Spectre Ops', 'VaporNet Core'], teamSize: ['3 Operators', '5 Operators (Full Cell)', '7 Global Nodes'] } },
  { id: 4, title: '4. Entity Formation (LLC Setup)', icon: 'briefcase', options: { jurisdiction: ['Delaware, USA', 'Wyoming Anonymous LLC', 'Nevis Offshore LLC'], ownership: ['Persona Identity', 'Nominee Manager', 'Burner Shell Entity'] } },
  { id: 5, title: '5. Crypto Wallet & Mixer Routing', icon: 'lock', options: { mixer: ['Tornado Cash Relay', 'CoinJoin P2P Pool', 'Monero Atomic Swap'], hardware: ['Coldcard Offline Vault', 'Trezor Hardware Safe', 'Air-Gapped Multi-Sig'] } },
  { id: 6, title: '6. Offshore Shell & Financial Logistics', icon: 'dollar-sign', options: { location: ['Panama City Bank', 'Zurich Nominee Account', 'Cayman Islands Shell'], transit: ['Wire Tunneling', 'Crypto Liquidity Pool', 'Physical Courier Drops'] } },
  { id: 7, title: '7. Forgery Studio & Document Forge', icon: 'layers', options: { template: ['Passport & Driver License', 'Birth Certificate & SSN', 'Corporate Deed & Mortgage', 'Cashier Check & Payroll'] } },
  { id: 8, title: '8. Crypto Treasury Asset Encryption', icon: 'shield', options: { asset: ['BTC Reserve', 'XMR Stealth Cache', 'ETH Smart Vault'], security: ['Shamir Secret Sharing', 'Hardware Ledger Matrix', 'Dead Man Trigger'] } },
  { id: 9, title: '9. Financial Leverage & Bookie Operations', icon: 'dices', options: { market: ['Offshore Sports Betting Bookie', 'High-Frequency Crypto Futures', 'Dark Pool Stock Arbitrage'] } },
  { id: 10, title: '10. Command Center & Visual Map', icon: 'image', options: { dashboard: ['Real-Time Visual Telemetry Board', 'Interactive Node Graph', 'Heads-Up Threat Matrix'] } },
  { id: 11, title: '11. Field Espionage & Target Ops', icon: 'eye', options: { target: ['Rival Tech Syndicate', 'Offshore Banking Director', 'Defense Contractor Node'], vector: ['Physical Infiltration & Credentials', 'Social Engineering Espionage', 'Blackmail / Credential Extraction'] } }
];

// ============================================================
// STORE & DEFAULTS
// ============================================================
const KEY = 'cybershift:v10';
const listeners = new Set();
const LAB_PASSCODE = "CYBER2026";

function defaults() {
  return {
    v: 10, role: null, day: 1, phase: 'auth', outcome: null,
    authenticated: false,
    difficulty: 'MEDIUM', currentStageIndex: 0,
    capital: 25000, paranoia: 5, caseStrength: 0,
    ap: 3, maxAp: 3,
    entities: { persona: [], account: [], shell: [], wallet: [] },
    breakoutState: {},
    evidence: [], logs: ['[SYS] Dual-Perspective Simulation Initialized.', '[SYS] Enter Authorized Lab Passcode to begin.'],
    progression: { xp: 0, level: 1, skillPoints: 1, skills: [] },
    selectedForgeDoc: 'Passport & Driver License',
    forgeOutput: null
  };
}

let state;
try {
  const raw = localStorage.getItem(KEY);
  const parsed = raw ? JSON.parse(raw) : null;
  state = parsed && parsed.v === 10 ? parsed : defaults();
} catch { state = defaults(); }

let persistTimer = null;
function persist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  }, 200);
}
function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function notify() { persist(); for (const fn of listeners) fn(state); }
function dispatch(mut) { const r = mut(state); notify(); return r; }
function selectRole(role) {
  dispatch(s => {
    s.role = role;
    s.authenticated = true;
    s.phase = 'briefing';
  });
}
function resetSimulation() {
  const fresh = defaults();
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, fresh);
  notify();
}

const clamp = (v, lo = 0, hi = 100) => Math.min(hi, Math.max(lo, v));
function haptic(p = 10) { try { navigator.vibrate?.(p); } catch {} }
function icons() { if (window.lucide) window.lucide.createIcons(); }

function toast(msg, ms = 1800) {
  const el = document.createElement('div');
  el.className = 'toast-anim fixed left-1/2 -translate-x-1/2 z-40 bg-cyberdark border border-cyberborder rounded-lg px-4 py-2 font-mono text-xs text-white shadow-xl';
  el.style.bottom = 'calc(80px + env(safe-area-inset-bottom))';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ============================================================
// ROUTING & NAVIGATION
// ============================================================
const routes = {};
let currentUnmount = null;
let renderGen = 0;
const register = (path, page) => { routes[path] = page; };
const currentPath = () => (location.hash.slice(1) || '/ops').split('?')[0];

function navigate(path) {
  if (location.hash === '#' + path) { render(); return; }
  location.hash = '#' + path;
}

async function render() {
  if (!state.authenticated || !state.role) {
    renderAuthGate();
    return;
  }
  if (state.phase === 'briefing') {
    renderBriefing();
    return;
  }
  const gen = ++renderGen;
  const path = currentPath();
  const page = routes[path] || routes['/ops'];
  const outlet = document.getElementById('outlet');
  if (!outlet || !page) return;
  if (currentUnmount) { try { currentUnmount(); } catch {} currentUnmount = null; }
  outlet.innerHTML = '';
  outlet.scrollTop = 0;
  if (page.mount) {
    const maybeUnmount = await page.mount(outlet);
    if (gen !== renderGen) return;
    if (typeof maybeUnmount === 'function') currentUnmount = maybeUnmount;
  }
  if (gen !== renderGen) return;
  icons();
  renderNav();
}

function renderTopbar() {
  const el = document.getElementById('topbar');
  if (!el) return;
  const isAttacker = state.role === 'attacker';
  el.innerHTML = `
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br ${isAttacker ? 'from-cyberred to-cyberpurple' : 'from-cyberblue to-cybergreen'} flex items-center justify-center">
        <i data-lucide="${isAttacker ? 'terminal' : 'shield-check'}" class="w-4 h-4 text-black"></i>
      </div>
      <div>
        <div class="font-mono font-bold text-xs tracking-wider text-white leading-none">CYBERSHIFT</div>
        <div class="font-mono text-[10px] ${isAttacker ? 'text-cyberred' : 'text-cyberblue'} leading-none mt-0.5">
          ${isAttacker ? 'ROB U. (RED TEAM)' : 'CRAIG B. (DEFENDER)'}
        </div>
      </div>
    </div>
    <div class="text-right">
      <div class="font-mono text-[10px] text-slate-500 leading-none">${isAttacker ? 'PARANOIA HEAT' : 'CASE STRENGTH'}</div>
      <div class="font-mono font-bold text-sm ${isAttacker ? 'text-cyberred' : 'text-cybergreen'}">
        ${isAttacker ? state.paranoia + '%' : state.caseStrength + '%'}
      </div>
    </div>`;
}

function renderStats() {
  const el = document.getElementById('stats');
  if (!el) return;
  el.innerHTML = `
    <div><div class="text-[9px] font-mono text-slate-500">RESOURCES</div>
         <div class="font-mono font-bold text-sm text-cybergreen">$${state.capital.toLocaleString()}</div></div>
    <div><div class="text-[9px] font-mono text-slate-500">STAGE</div>
         <div class="font-mono font-bold text-sm text-cyberblue">${state.currentStageIndex + 1}/11</div></div>
    <div><div class="text-[9px] font-mono text-slate-500">MODE</div>
         <div class="font-mono font-bold text-sm text-amber-400">${state.difficulty}</div></div>`;
}

const NAV_TABS_ATTACKER = [
  { path: '/ops',        icon: 'terminal',     label: 'MISSIONS' },
  { path: '/forge',      icon: 'layers',       label: 'FORGE' },
  { path: '/whiteboard', icon: 'image',        label: 'MAP' },
  { path: '/evidence',   icon: 'file-search',  label: 'LOGS' },
  { path: '/skills',     icon: 'brain',        label: 'SKILLS' }
];

const NAV_TABS_DEFENDER = [
  { path: '/ops',        icon: 'shield',       label: 'DEFENSE' },
  { path: '/evidence',   icon: 'file-search',  label: 'EVIDENCE' },
  { path: '/whiteboard', icon: 'image',        label: 'NETWORK' },
  { path: '/skills',     icon: 'brain',        label: 'SKILLS' }
];

function renderNav() {
  const tabs = state.role === 'attacker' ? NAV_TABS_ATTACKER : NAV_TABS_DEFENDER;
  const here = currentPath();
  const el = document.getElementById('bottomnav');
  if (!el) return;
  el.innerHTML = tabs.map(t => `
    <button data-path="${t.path}" class="${here === t.path ? 'active' : ''}">
      <i data-lucide="${t.icon}" class="w-4 h-4"></i>
      <span>${t.label}</span>
    </button>`).join('');
  el.querySelectorAll('button').forEach(btn =>
    btn.addEventListener('click', () => { haptic(8); navigate(btn.dataset.path); }));
}

function renderShell() { renderTopbar(); renderStats(); renderNav(); }

// ============================================================
// AUTHORIZATION & CHARACTER SELECTION GATE
// ============================================================
function renderAuthGate() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="fixed inset-0 z-50 bg-cyberdark flex items-center justify-center p-4 overflow-y-auto">
      <div class="max-w-md w-full bg-cybercard border border-cyberborder rounded-2xl p-6 space-y-4 shadow-2xl text-center my-auto">
        <div class="w-16 h-16 rounded-2xl bg-cyberblue/10 border border-cyberblue/30 mx-auto flex items-center justify-center">
          <i data-lucide="shield-alert" class="w-8 h-8 text-cyberblue"></i>
        </div>
        <div>
          <h1 class="font-mono text-lg font-bold text-white">CYBERSHIFT SIMULATOR</h1>
          <p class="text-xs text-slate-400 mt-1">Dual-Perspective Cybersecurity & Threat Mindset Training</p>
        </div>

        <div class="space-y-3 text-left">
          <label class="text-[10px] font-mono text-slate-400 uppercase">Lab Passcode Required</label>
          <input type="password" id="passcode-input" placeholder="Passcode (Default: CYBER2026)" 
            class="w-full bg-cyberdark border border-cyberborder rounded-lg px-3 py-2 text-center text-sm font-mono text-white focus:outline-none focus:border-cyberblue">
        </div>

        <div class="space-y-3 pt-2">
          <div class="text-[10px] font-mono text-slate-400 uppercase text-left">Select Your Operative Perspective</div>
          
          <button data-role="attacker" class="tap-card border-cyberred/40 hover:border-cyberred">
            <div class="w-10 h-10 rounded-lg bg-cyberred/15 flex items-center justify-center shrink-0">
              <i data-lucide="terminal" class="w-5 h-5 text-cyberred"></i>
            </div>
            <div class="flex-1">
              <div class="font-mono text-xs font-bold text-cyberred">ROB U. (Red Team / Attacker)</div>
              <div class="text-[10px] text-slate-400">Childhood abandonment survivor. Master of evasion, automated pipelines & retribution.</div>
            </div>
          </button>

          <button data-role="defender" class="tap-card border-cybergreen/40 hover:border-cybergreen">
            <div class="w-10 h-10 rounded-lg bg-cybergreen/15 flex items-center justify-center shrink-0">
              <i data-lucide="shield-check" class="w-5 h-5 text-cybergreen"></i>
            </div>
            <div class="flex-1">
              <div class="font-mono text-xs font-bold text-cybergreen">CRAIG BLUEBIRD (Cyber Officer)</div>
              <div class="text-[10px] text-slate-400">Ghetto survivor turned military defender. Dedicated to dismantling threats & protecting systems.</div>
            </div>
          </button>
        </div>
      </div>
    </div>`;
  icons();

  document.querySelectorAll('button[data-role]').forEach(btn => {
    btn.addEventListener('click', () => {
      const passcode = document.getElementById('passcode-input').value.trim();
      if (passcode !== LAB_PASSCODE) {
        toast('Invalid Lab Passcode (Use CYBER2026)');
        haptic([40, 60, 40]);
        return;
      }
      haptic(15);
      selectRole(btn.dataset.role);
      boot();
    });
  });
}

// ============================================================
// CHARACTER BRIEFING STORY SCREEN
// ============================================================

  const app = document.getElementById('app');
  const isAttacker = state.role === 'attacker';

        <div class="flex items-center gap-3">

// ============================================================
// PAGE: BREAKOUT MISSIONS & DEFENSE OPS
// ============================================================
const opsPage = {
  async mount(root) {

    const stage = STAGES[state.currentStageIndex] || STAGES[10];

    root.innerHTML = `
      <div class="p-4 space-y-4">
        <!-- Difficulty & Perspective Banner -->
        <div class="flex items-center justify-between bg-cybercard border border-cyberborder p-3 rounded-xl text-xs">
          <div>
            <div class="text-[10px] font-mono text-slate-400">OPERATIVE</div>
            <div class="font-mono font-bold ${isAttacker ? 'text-cyberred' : 'text-cybergreen'}">${isAttacker ? 'Rob U. (Attacker)' : 'Craig B. (Officer)'}</div>
          </div>
          <div class="flex gap-1 font-mono font-bold">
            ${['EASY', 'MEDIUM', 'HACKER'].map(d => `

        </div>

        <!-- Mission Stage Panel -->
        <div class="bg-cybercard border ${isAttacker ? 'border-cyberred/40' : 'border-cybergreen/40'} rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center border-b border-cyberborder pb-2">
            <div class="flex items-center gap-2">

            </div>

          </div>

          <div class="space-y-3 pt-2">
            ${Object.entries(stage.options).map(([key, opts]) => `

                <div class="text-[10px] font-mono text-slate-400 uppercase font-bold mb-1">${key}:</div>
                <div class="flex flex-wrap gap-1">
                  ${opts.map(opt => `
                    <button class="opt-btn text-[11px] bg-cyberdark hover:bg-slate-800 text-slate-200 px-2 py-1 rounded border border-cyberborder font-mono">
                      ${opt}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}

            ${stage.id === 9 && isAttacker ? `
              <div class="p-3 bg-cyberdark border border-cyberborder rounded-lg space-y-2">
                <div class="text-xs font-mono text-slate-300">Bookie Operations Wager:</div>
                <div class="flex gap-2">
                  <button id="bet-low" class="px-3 py-1 bg-cybergreen text-black text-xs font-bold font-mono rounded">Low Risk (70%)</button>
                  <button id="bet-high" class="px-3 py-1 bg-cyberred text-white text-xs font-bold font-mono rounded">High Risk (30%)</button>
                </div>
              </div>
            ` : ''}

            <button id="execute-btn" class="w-full mt-3 ${isAttacker ? 'bg-cyberred text-white' : 'bg-cybergreen text-black'} text-xs font-mono font-bold py-3 rounded-lg flex items-center justify-center gap-2">
              ${isAttacker ? 'Execute Offensive Mission' : 'Harden System & Verify Defense'} <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Terminal Output -->
        <div class="bg-cyberdark border border-cyberborder rounded-xl p-3 h-48 flex flex-col justify-between font-mono text-xs">
          <div class="text-[10px] text-slate-500 border-b border-cyberborder pb-1">TERMINAL LOGS (TTY ENCRYPTED)</div>
          <div id="term-logs" class="overflow-y-auto space-y-1 my-2 text-slate-300">
            ${state.logs.map(l => `<div>${l}</div>`).join('')}
          </div>
          <form id="term-form" class="flex gap-2 border-t border-cyberborder pt-1">
            <span class="${isAttacker ? 'text-cyberred' : 'text-cybergreen'} font-bold">&gt;</span>
            <input id="term-input" type="text" placeholder="Type 'status', 'advance', 'help', or 'clear'..." class="bg-transparent text-xs text-white focus:outline-none flex-1">
          </form>
        </div>
      </div>
    `;

    root.querySelectorAll('button[data-diff]').forEach(b => {
      b.addEventListener('click', () => {
        dispatch(s => {
          s.difficulty = b.dataset.diff;
          if (s.difficulty === 'EASY') s.capital = 100000;
          if (s.difficulty === 'MEDIUM') s.capital = 25000;
          if (s.difficulty === 'HACKER') s.capital = 2500;
        });
        toast(`Difficulty: ${b.dataset.diff}`);
        renderShell();
        opsPage.mount(root);
      });
    });

    root.querySelectorAll('.opt-btn').forEach(b => {
      b.addEventListener('click', () => { toast(`Selected: ${b.textContent.trim()}`); });
    });

    root.querySelector('#execute-btn')?.addEventListener('click', () => { executeStage(); });

    root.querySelector('#term-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = root.querySelector('#term-input');
      const cmd = input.value.trim().toLowerCase();
      if (!cmd) return;
      input.value = '';

      dispatch(s => { s.logs.push(`> ${cmd}`); });
      if (cmd === 'help') {
        dispatch(s => { s.logs.push('[SYS] Commands: advance, status, clear, help'); });
      } else if (cmd === 'status') {
        dispatch(s => { s.logs.push(`[STATUS] Heat: ${s.paranoia}% | Case: ${s.caseStrength}% | Credits: $${s.capital}`); });
      } else if (cmd === 'clear') {
        dispatch(s => { s.logs = []; });
      } else if (cmd === 'advance') {
        executeStage();
        return;
      } else {
        dispatch(s => { s.logs.push(`[ERR] Unknown command: ${cmd}`); });
      }
      opsPage.mount(root);
    });

    function executeStage() {
      dispatch(s => {
        const mod = s.difficulty === 'EASY' ? 0.5 : s.difficulty === 'MEDIUM' ? 1.0 : 2.0;
        const inc = Math.floor((Math.random() * 8 + 4) * mod);
        const cost = Math.floor(Math.random() * 800 + 200);

        if (s.role === 'attacker') {
          s.paranoia = clamp(s.paranoia + inc);
          s.capital = Math.max(0, s.capital - cost);
          s.logs.push(`[${new Date().toLocaleTimeString()}] Offensive Stage ${stage.id} executed. Heat: +${inc}%`);
        } else {
          s.caseStrength = clamp(s.caseStrength + 10);
          s.logs.push(`[${new Date().toLocaleTimeString()}] Defensive Control ${stage.id} verified. Case Strength: +10%`);
        }

        s.breakoutState[stage.id] = true;
        s.evidence.push({
          id: `ev_${Date.now()}`,
          stage: stage.title,
          timestamp: new Date().toLocaleTimeString(),
          fidelity: `${Math.floor(80 + Math.random() * 20)}%`
        });

        if (s.currentStageIndex < STAGES.length - 1) {
          s.currentStageIndex += 1;
        } else {
          s.logs.push(`[SIMULATION COMPLETE] All 11 Operational Milestones Achieved.`);
        }
      });
      haptic(20);
      renderShell();
      opsPage.mount(root);
    }

    root.querySelector('#bet-low')?.addEventListener('click', () => handleWager(0.7));
    root.querySelector('#bet-high')?.addEventListener('click', () => handleWager(0.3));

    function handleWager(ratio) {
      dispatch(s => {
        const wager = 1000;
        if (s.capital < wager) { toast('Insufficient funds'); return; }
        if (Math.random() < ratio) {
          s.capital += wager * 2;
          s.logs.push(`[WAGER WIN] +$${wager * 2}`);
          toast('Wager Won!');
        } else {
          s.capital -= wager;
          s.logs.push(`[WAGER LOST] -$${wager}`);
          toast('Wager Lost.');
        }
      });
      renderShell();
      opsPage.mount(root);
    }

    icons();
  }
};

function drawDocumentCanvas(canvas, output) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 2;
  ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 11px "JetBrains Mono"';
  ctx.fillText('SYNTHETIC DOCUMENT PAYLOAD', 15, 25);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '10px "JetBrains Mono"';
  ctx.fillText(`TYPE: ${output.type}`, 15, 50);
  ctx.fillText(`ID: ${output.id}`, 15, 70);
  ctx.fillText(`IP: ${output.assignedIp}`, 15, 90);
  ctx.fillText(`HASH: ${output.hash}`, 15, 110);
  ctx.fillStyle = '#10b981';
  ctx.fillRect(15, 130, 80, 25);
  ctx.fillStyle = '#0a0f1d';
  ctx.font = 'bold 10px "JetBrains Mono"';
  ctx.fillText('VERIFIED', 30, 146);
}

const whiteboardPage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-4">
        <div class="bg-cybercard border border-cyberborder rounded-xl p-4">
          <h2 class="font-mono text-xs uppercase tracking-wider text-cybergreen mb-3">Tactical Network Node Canvas</h2>
          <canvas id="map-canvas" width="320" height="240" class="w-full bg-slate-900 border border-cyberborder rounded-lg mb-3"></canvas>
          <div class="grid grid-cols-2 gap-2 font-mono text-[11px]">
            <div class="p-2 bg-cyberdark border border-cyberblue/40 rounded text-cyberblue">Node A: Pipeline</div>
            <div class="p-2 bg-cyberdark border border-cyberpurple/40 rounded text-cyberpurple">Node B: Entity</div>
            <div class="p-2 bg-cyberdark border border-cybergreen/40 rounded text-cybergreen">Node C: Treasury</div>
            <div class="p-2 bg-cyberdark border border-cyberred/40 rounded text-cyberred">Node D: Espionage</div>
          </div>
        </div>
      </div>
    `;
    const canvas = root.querySelector('#map-canvas');
    if (canvas) drawNodeMap(canvas);
    icons();
  }
};

function drawNodeMap(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const nodes = [
    { x: 50, y: 50, label: 'Pipeline', color: '#38bdf8' },
    { x: 270, y: 50, label: 'Entity', color: '#a855f7' },
    { x: 50, y: 190, label: 'Treasury', color: '#10b981' },
    { x: 270, y: 190, label: 'Espionage', color: '#f43f5e' }
  ];
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[1].x, nodes[1].y);
  ctx.moveTo(nodes[1].x, nodes[1].y); ctx.lineTo(nodes[3].x, nodes[3].y);
  ctx.moveTo(nodes[3].x, nodes[3].y); ctx.lineTo(nodes[2].x, nodes[2].y);
  ctx.moveTo(nodes[2].x, nodes[2].y); ctx.lineTo(nodes[0].x, nodes[0].y);
  ctx.stroke();
  nodes.forEach(n => {
    ctx.fillStyle = n.color;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px "JetBrains Mono"';
    ctx.fillText(n.label, n.x - 20, n.y + 28);
  });
}

    <div id="shell" class="app-shell">
      <header id="topbar" class="app-topbar safe-top"></header>
      <div id="stats" class="app-stats"></div>
      <main id="outlet" class="page-scroll"></main>
      <nav id="bottomnav" class="app-bottomnav safe-bottom"></nav>
    </div>`;

  register('/ops', opsPage);
  register('/forge', forgePage);
  register('/whiteboard', whiteboardPage);
  register('/evidence', evidencePage);
  register('/skills', skillsPage);

  renderShell();
  if (!location.hash) history.replaceState(null, '', '#/ops');
  render();

  subscribe(() => { renderShell(); });
}

window.addEventListener('hashchange', render);
if (!state.authenticated || !state.role) renderAuthGate();
else boot();
