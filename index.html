}

const terminalPage = {
  async mount(root) {
    root.innerHTML = `
      <div class="p-4 space-y-3 h-full flex flex-col">
        <div class="flex justify-between items-center">
          <span class="font-mono text-xs uppercase text-slate-400">Interactive TTY Terminal (100+ Commands Loaded)</span>
          <button onclick="window.clearTerm()" class="px-2 py-1 bg-cyberdark border border-cyberborder rounded text-[10px] font-mono text-slate-400">Clear</button>
        </div>
        <div id="tty-screen" class="flex-1 bg-cyberdark border border-cyberborder rounded-xl p-3 font-mono text-xs text-slate-200 overflow-y-auto space-y-1.5 min-h-[320px]">
          ${state.termLogs.map(l => `<div>${l}</div>`).join('')}
        </div>
        <form id="tty-form" class="flex gap-2">
          <span class="text-cyberblue font-bold font-mono">&gt;</span>
          <input id="tty-input" type="text" placeholder="Type 'help' for all commands or any command like 'nmap', 'tor', 'scan'..." class="bg-cyberdark border border-cyberborder rounded px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-cyberblue flex-1">
          <button type="submit" class="px-4 bg-cyberblue text-black font-mono font-bold text-xs rounded">RUN</button>
        </form>
      </div>
    `;

    const screen = root.querySelector('#tty-screen');
    if (screen) screen.scrollTop = screen.scrollHeight;

    root.querySelector('#tty-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = root.querySelector('#tty-input');
      const raw = input.value.trim();
      if (!raw) return;
      input.value = '';

      state.termLogs.push(`> ${raw}`);
      const parts = raw.split(' ');
      const cmdName = parts[0].toLowerCase();
      const args = parts.slice(1);

      if (COMMANDS[cmdName]) {
        try {
          const res = COMMANDS[cmdName].fn(args);
          if (res) state.termLogs.push(res);
        } catch (err) {
          state.termLogs.push(`[ERR] Execution failed: ${err.message}`);
        }
      } else {
        state.termLogs.push(`[ERR] Command not found: ${cmdName}. Type 'help' for available commands.`);
      }

      notify();
      terminalPage.mount(root);
    });

    icons();
  }
};

window.initRole = (role) => {
  const code = document.getElementById('passcode')?.value.trim();
  if (code !== LAB_PASSCODE) { toast('Invalid Lab Passcode'); return; }
  state.role = role; 
  state.authenticated = true;
  state.phase = 'briefing';
  notify();
};

window.startSim = () => { 
  state.phase = 'active'; 
  notify(); 
  navigate('/ops'); 
};

window.selectMission = (id) => {
  const m = GTA_MISSIONS.find(x => x.id === id);
  if (m) {
    state.activeMission = m;
    state.termLogs.push(`[MISSION] Switched active operation to: ${m.title}`);
    notify();
    toast(`Activated: ${m.title}`);
  }
};

window.clearTerm = () => {
  state.termLogs = ['[SYS] Terminal screen cleared. Type "help" for command list.'];
  notify();
};

window.exportReport = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `eSAR_Case_Report_${Date.now()}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
  toast('e-SAR Package Exported');
};
